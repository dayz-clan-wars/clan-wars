# Catch-all for requests whose Host matches no vhost.
#
# ⚠️ Without this, nginx serves an unmatched Host from whichever server block
# loaded first — alphabetically, dayzonelife.com. Before this file existed, a
# request for dayzclanwars.com returned a 301 to dayzonelife.com: a leak
# between unrelated properties caused purely by file load order.
#
# 444 closes the connection with no response. It is the right answer to a
# request for a name this server does not serve.
#
# Named 00- so it loads before every sites-enabled vhost.
#
# ⚠️ Deliberately no `:443 default_server` here. An HTTPS request for an
# unknown name still needs a certificate to present during the TLS handshake
# before nginx ever gets to look at the Host header, and whatever cert this
# block picked would be for the wrong name — SNI plus a cert mismatch makes
# the handshake fail (or the client warn loudly) on its own. That makes the
# HTTPS version of the cross-site leak this file closes for :80 much weaker
# to begin with, so there's nothing here to add.
#
# ⚠️ Coupling: if any other vhost on this host later adds `default_server` to
# its own `listen 80`, `nginx -t` fails with a duplicate default server error
# — for ALL sites, not just this one — and blocks every reload on the box
# until it's reconciled.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
