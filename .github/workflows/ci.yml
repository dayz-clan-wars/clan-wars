name: "ci"
on:
  push:
    branches: ["main"]
  pull_request:
permissions:
  contents: read
jobs:
  node:
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        node: ["20"]
    services:
      postgres:
        image: "postgres:16"
        env:
          POSTGRES_PASSWORD: "postgres"
          POSTGRES_DB: "factions"
        ports:
          - "5432:5432"
        options: "--health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5"
    env:
      TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/factions"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7
      - uses: "pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271"  # v6.0.9
      - uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020"  # v7
        with:
          node-version: "${{ matrix.node }}"
          cache: "pnpm"
      - run: "pnpm install --frozen-lockfile"
      # The suites migrate, truncate and reseed constantly, and every commit waits
      # on a disk flush this throwaway container never needs. Service containers
      # take no `-c` flags, so it is set here; all three are reloadable.
      # ⚠️ Hand-added: rigging (.rigging.json) has no key for extra steps, so a
      # re-scaffold of this file drops this step silently. It MUST stay here, and
      # never move into `pnpm run ci` — that script also runs against the local
      # Postgres on 5434, which holds factions_live.
      - run: >-
          psql "$TEST_DATABASE_URL"
          -c "alter system set fsync = off"
          -c "alter system set synchronous_commit = off"
          -c "alter system set full_page_writes = off"
          -c "select pg_reload_conf()"
      - run: "pnpm run ci"
