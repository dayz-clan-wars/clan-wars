name: "security"
on:
  push:
    branches: ["main"]
  pull_request:
permissions:
  contents: read
jobs:
  trufflehog:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7
        with:
          fetch-depth: "0"
      - uses: "trufflesecurity/trufflehog@4ef51f69ca6347aaa76a5e64a87eac9c0c909f71"  # v3.100.1
        with:
          extra_args: "--results=verified,unknown"
