services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: factions
      POSTGRES_PASSWORD: factions
      POSTGRES_DB: factions
    ports: ["5434:5432"]
    volumes: ["factions-pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factions"]
      interval: 5s
      timeout: 5s
      retries: 5
  ingest-worker:
    build: { context: ., dockerfile: apps/ingest-worker/Dockerfile }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      # ⚠️ factions_live, NOT factions. Eleven test files truncate `servers`,
      # `events` and `raw_lines` in `factions`, so pointing the worker there
      # would have every ingested event deleted by the next `pnpm test`.
      DATABASE_URL: postgres://factions:factions@postgres:5432/factions_live
      NITRADO_TOKEN: ${NITRADO_TOKEN}
      INGEST_INTERVAL_SECONDS: "60"
      ADM_BACKFILL_BUDGET: "15"
      # The mission's custom/ folder, where DayZ's object spawner reads the
      # files named in cfggameplay.json's objectSpawnersArr.
      #
      # ⚠️ NOT under the gameserver's advertised game_specific.path
      # (/games/.../noftp/dayzxb/), which exposes only config/. The mission
      # tree lives in a separate ftproot/dayzxb_missions/ path, and
      # paths_available is null, so this cannot be derived — it was read off
      # the Nitrado file API. A wrong value uploads the file where the server
      # never reads it, and the upload still reports success.
      MISSION_CUSTOM_DIR: ${MISSION_CUSTOM_DIR}
volumes:
  factions-pg:
