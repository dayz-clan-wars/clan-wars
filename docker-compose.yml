services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: factions
      POSTGRES_PASSWORD: factions
      POSTGRES_DB: factions
    ports: ["5434:5432"]
    volumes: ["factions-pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factions"]
      interval: 5s
      timeout: 5s
      retries: 5
  ingest-worker:
    build: { context: ., dockerfile: apps/ingest-worker/Dockerfile }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      # ⚠️ factions_live, NOT factions. Eleven test files truncate `servers`,
      # `events` and `raw_lines` in `factions`, so pointing the worker there
      # would have every ingested event deleted by the next `pnpm test`.
      DATABASE_URL: postgres://factions:factions@postgres:5432/factions_live
      NITRADO_TOKEN: ${NITRADO_TOKEN}
      INGEST_INTERVAL_SECONDS: "60"
      ADM_BACKFILL_BUDGET: "15"
      # ⚠️ No MISSION_CUSTOM_DIR. The supply file's destination is per SERVER,
      # not per process: the path embeds the gameserver's username, so one
      # value here was correct for exactly one server and silently wrong for
      # every other. It is resolved from each server's own Nitrado service
      # each sweep — see NitradoClient.missionCustomDir.
  # ⚠️ This file also describes `postgres` and `ingest-worker`, which must NOT
  # be started on the VPS. A bare `docker compose up -d` there would stand up a
  # second, EMPTY Postgres that looks like a working database and holds none of
  # the live data. On the VPS, name the services: `docker compose up -d web caddy`.
  # ⚠️ Image verified on linux/arm64 (native `docker compose build web` on the
  # dev machine) AND linux/amd64 (`docker build --platform linux/amd64`, under
  # QEMU emulation) on 2026-09-03 — see task-5-report.md. Both resolved and
  # installed the correct platform-specific sharp binary from the lockfile
  # (`@img/sharp-linuxmusl-arm64` / `-x64`), so neither architecture depends on
  # an untested guess. If the VPS is some third architecture, rebuild and
  # re-check before trusting this image there.
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    environment:
      NODE_ENV: production
    # ⚠️ No ports mapping. Caddy is the only thing that should reach it, and
    # publishing 3000 would serve the site over plain HTTP alongside the
    # TLS one.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [web]
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  factions-pg:
  caddy-data:
  caddy-config:
