# ⚠️ Never `docker compose up -d` bare on this host. Name the services. There
# is no second machine: postgres, ingest-worker and web all run here, and the
# bot runs beside them under systemd (deploy/systemd/clan-wars-bot.service).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: factions
      POSTGRES_PASSWORD: factions
      POSTGRES_DB: factions
    # ⚠️ Loopback only — same reasoning as the `web` service below: Docker
    # writes its own ACCEPT rules into the DOCKER iptables chain when a port
    # is published, and that bypasses ufw entirely. A bare "5434:5432" here
    # would listen on 0.0.0.0 with the credentials factions/factions on a
    # public host regardless of what ufw allows. The test gate is unaffected —
    # TEST_DATABASE_URL already points at localhost:5434.
    ports: ["127.0.0.1:5434:5432"]
    # ⚠️ Without this the whole stack fails to survive a reboot, silently from
    # the bot's point of view: postgres.js connects lazily and every bot tick
    # is individually try/caught, so the bot process itself never exits and
    # keeps reporting `active (running)` under systemd with the entire data
    # path dead. `web` and `ingest-worker` already carry this; postgres is the
    # one that actually holds the data.
    restart: unless-stopped
    volumes: ["factions-pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factions"]
      interval: 5s
      timeout: 5s
      retries: 5
  ingest-worker:
    build: { context: ., dockerfile: apps/ingest-worker/Dockerfile }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      # ⚠️ factions_live, NOT factions. Eleven test files truncate `servers`,
      # `events` and `raw_lines` in `factions`, so pointing the worker there
      # would have every ingested event deleted by the next `pnpm test`.
      DATABASE_URL: postgres://factions:factions@postgres:5432/factions_live
      NITRADO_TOKEN: ${NITRADO_TOKEN}
      INGEST_INTERVAL_SECONDS: "60"
      ADM_BACKFILL_BUDGET: "15"
      # ⚠️ No MISSION_CUSTOM_DIR. The supply file's destination is per SERVER,
      # not per process: the path embeds the gameserver's username, so one
      # value here was correct for exactly one server and silently wrong for
      # every other. It is resolved from each server's own Nitrado service
      # each sweep — see NitradoClient.missionCustomDir.
  # ⚠️ Image verified on linux/arm64 (native `docker compose build web` on the
  # dev machine) AND linux/amd64 (`docker build --platform linux/amd64`, under
  # QEMU emulation) on 2026-09-03 — see task-5-report.md. Both resolved and
  # installed the correct platform-specific sharp binary from the lockfile
  # (`@img/sharp-linuxmusl-arm64` / `-x64`), so neither architecture depends on
  # an untested guess. If the VPS is some third architecture, rebuild and
  # re-check before trusting this image there.
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # ⚠️ Discord login. All six are read at RUNTIME by server code only.
      # None may ever be prefixed NEXT_PUBLIC_ — that inlines the value into
      # the client bundle, which for the client secret means publishing it.
      WEB_BASE_URL: ${WEB_BASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_JOIN_BOT_TOKEN: ${DISCORD_JOIN_BOT_TOKEN}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
    # ⚠️ Loopback only. The system nginx terminates TLS for dayzclanwars.com
    # and proxies here; publishing 0.0.0.0 would serve the same site over
    # plain HTTP on :3020 alongside the TLS one.
    # 3020 is deliberately outside the 3000-3011 band the other projects on
    # this host occupy (dayzonelife.com :3010, factory.eli5hq.com :3100).
    ports: ["127.0.0.1:3020:3000"]
volumes:
  factions-pg:
